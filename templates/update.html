<!DOCTYPE html>
<html>
<head>
    <title>Update Task</title>
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" 
        rel="stylesheet">
</head>
<body>
    {% include 'navbar.html' %}
    <h1>Update Task</h1>

    <form method="POST">

        <input
            type="text"
            name="name"
            value="{{ task[1] }}"
            required>

        <br><br>

        <input
            type="text"
            name="status"
            value="{{ task[2] }}"
            required>

        <br><br>
        <input type="date" name="due_date" value="{{ task[4] }}">
        <br><br>

        <button type="submit">
            Update Task
        </button>

    </form>

</body>
</html>
