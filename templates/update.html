<!DOCTYPE html>
<html>
<head>
    <title>Update Task</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    {% include 'navbar.html' %}

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-2">
                            Update Task
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Modify your task details below.
                        </p>


                        <form method="POST">

                            <!-- Task Name -->

                            <div class="mb-3">

                                <label
                                    for="name"
                                    class="form-label">
                                    Task Name
                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    name="name"
                                    value="{{ task[2] }}"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- Status -->

                            <div class="mb-3">

                                <label
                                    for="status"
                                    class="form-label">
                                    Status
                                </label>

                                <select
                                    id="status"
                                    name="status"
                                    class="form-select">

                                    <option
                                        value="pending"
                                        {% if task[3] == "pending" %}
                                            selected
                                        {% endif %}>
                                        Pending
                                    </option>

                                    <option
                                        value="done"
                                        {% if task[3] == "done" %}
                                            selected
                                        {% endif %}>
                                        Done
                                    </option>

                                </select>

                            </div>


                            <!-- Priority -->

                            <div class="mb-3">

                                <label
                                    for="priority"
                                    class="form-label">
                                    Priority
                                </label>

                                <select
                                    id="priority"
                                    name="priority"
                                    class="form-select">

                                    <option
                                        value="high"
                                        {% if task[5] == "high" %}
                                            selected
                                        {% endif %}>
                                        🔥 High
                                    </option>

                                    <option
                                        value="medium"
                                        {% if task[5] == "medium" %}
                                            selected
                                        {% endif %}>
                                        🟡 Medium
                                    </option>

                                    <option
                                        value="low"
                                        {% if task[5] == "low" %}
                                            selected
                                        {% endif %}>
                                        🟢 Low
                                    </option>

                                </select>

                            </div>


                            <!-- Due Date -->

                            <div class="mb-4">

                                <label
                                    for="due_date"
                                    class="form-label">
                                    Due Date
                                </label>

                                <input
                                    type="date"
                                    id="due_date"
                                    name="due_date"
                                    value="{{ task[4] }}"
                                    class="form-control">

                            </div>


                            <!-- Submit -->

                            <button
                                type="submit"
                                class="btn btn-primary w-100">

                                Update Task

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
