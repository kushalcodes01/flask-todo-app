<!DOCTYPE html>
<html>
<head>
    <title>Update Task</title>
</head>
<body>
    {% include 'navbar.html' %}
    <h1>Update Task</h1>

    <form method="POST">

        <input
            type="text"
            name="name"
            value="{{ task[1] }}"
            required>

        <br><br>

        <input
            type="text"
            name="status"
            value="{{ task[2] }}"
            required>

        <br><br>

        <button type="submit">
            Update Task
        </button>

    </form>

</body>
</html>
