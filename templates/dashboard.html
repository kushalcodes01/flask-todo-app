<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" 
        rel="stylesheet">
</head>
<body>

    {% include 'navbar.html' %}

    <h1>Welcome {{ username }}</h1>

    <hr>

    <h2>Dashboard</h2>

    <div class="container mt-4">

    <div class="row">

        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Total Tasks</h5>
                    <h2>{{ total_tasks }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Completed</h5>
                    <h2>{{ completed_tasks }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Pending</h5>
                    <h2>{{ pending_tasks }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Completion Rate</h5>
                    <h2>{{ completion_rate }}%</h2>
                </div>
            </div>
        </div>

    </div>

</div>

    <hr>

    <a href="/form">
        <button>Add Task</button>
    </a>

    <a href="/show">
        <button>View Tasks</button>
    </a>

    <a href="/search">
        <button>Search Task</button>
    </a>

</body>
</html>
