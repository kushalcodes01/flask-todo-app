<!DOCTYPE html>
<html>
<head>
    <title>Task Details</title>
    <link h
        ref="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" 
        rel="stylesheet">
</head>
<body>
    {% include 'navbar.html' %}
    <h1>Task Details</h1>

    {% if task %}

        <p><strong>ID:</strong> {{ task[0] }}</p>

        <p><strong>Name:</strong> {{ task[1] }}</p>

        <p><strong>Status:</strong> {{ task[2] }}</p>

    {% else %}

        <h3>Task Not Found</h3>

    {% endif %}

</body>
</html>
