<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h1 class="text-center">
                        To-Do App
                    </h1>

                    <p class="text-center text-muted">
                        Login to manage your tasks
                    </p>

                    <form method="POST">

                        <input
                            type="text"
                            name="username"
                            placeholder="Username"
                            class="form-control"
                            required>

                        <br><br>

                        <input
                            type="password"
                            name="password"
                            placeholder="Password"
                            class="form-control"
                            required>

                        <br><br>

                       <button
                            type="submit"
                            class="btn btn-primary w-100">
                                Login
                        </button>

                        <p class="text-center mt-3">

                            Don't have an account?

                            <a href="/register">
                                Register
                            </a>

                        </p>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
