<!DOCTYPE html>
<html>
<head>
    <title>All Tasks</title>
    <link h
        ref="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" 
        rel="stylesheet">
</head>
<body>

    {% include 'navbar.html' %}

    <h1>All Tasks</h1>

    {% if tasks %}

    <table class="table table-striped table-hover">
    <tr>
    <th>Task ID</th>
        <th>Task Name</th>
        <th>Status</th>
        <th>Due Date</th>
        <th>Update</th>
        <th>Delete</th>
    </tr>

        {% for task in tasks %}

        <tr>
            <td>{{ task[0] }}</td>
            <td>{{ task[2] }}</td>
            <td>{{ task[3] }}</td>
            <td>{{ task[4] }}</td>

            <td>
                <a href="/update/{{ task[0] }}">
                    Update
                </a>
            </td>

            <td>
                <a href="/delete/{{ task[0] }}">
                    Delete
                </a>
            </td>
        </tr>

        {% endfor %}

    </table>

    {% else %}

    <h3>No Tasks Found</h3>

    {% endif %}

</body>
</html>
