<!DOCTYPE html>
<html>
<head>
    <title>Add Task</title>
</head>
<body>
    {% include 'navbar.html' %}
    <h1>Add Task</h1>

    <form method="POST">

        <input
            type="text"
            name="name"
            placeholder="Task Name"
            required>

        <br><br>

        <input
            type="text"
            name="status"
            placeholder="Pending / Done"
            required>

        <br><br>

        <button type="submit">
            Add Task
        </button>

    </form>

</body>
</html>
